<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Minecraft Buddy</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #202830;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .panel {
      max-width: 520px;
      margin: 25px auto;
      padding: 24px;
      background: #303b46;
      border: 2px solid #6b9e52;
      border-radius: 12px;
    }

    h1 { color: #8fd16a; }

    button {
      width: 100%;
      padding: 13px;
      margin: 12px 0;
      border: none;
      border-radius: 6px;
      background: #5b913e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .relay {
      margin: 12px 0;
      padding: 12px;
      background: #172029;
      border-radius: 6px;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .address {
      color: #c5d0da;
      font-size: 13px;
    }

    .status {
      margin-top: 8px;
      color: #ffd36a;
    }

    .note {
      color: #c5d0da;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <div class="panel">
    <h1>🤖 AI Minecraft Buddy</h1>

    <p>AI相棒プロジェクト</p>
    <p>対象：Eaglercraft 1.20.6 WASM-GC</p>

    <h3>STEP 2：Relay接続テスト</h3>

    <p class="note">
      AIプレイヤーを作る前に、通信先へ接続できるか調べます。
    </p>

    <div id="relayList"></div>

    <button id="testButton">
      3つのRelayをテスト
    </button>

    <p id="summary" role="status">
      🔵 テスト待機中
    </p>

    <p class="note">
      このテストはRelayへのWebSocket接続だけを確認します。<br>
      Minecraftへの参加やAIの動作はまだ実装されていません。
    </p>
  </div>

  <script>
    const relays = [
      {
        name: "Relay 1",
        url: "wss://relay.deev.is/"
      },
      {
        name: "Relay 2",
        url: "wss://relay.lax1dude.net/"
      },
      {
        name: "Relay 3",
        url: "wss://relay.shhnowisnottheti.me/"
      }
    ];

    const list = document.getElementById("relayList");
    const button = document.getElementById("testButton");
    const summary = document.getElementById("summary");

    const statusElements = [];

    relays.forEach((relay) => {
      const box = document.createElement("div");
      box.className = "relay";

      const name = document.createElement("strong");
      name.textContent = relay.name;

      const address = document.createElement("div");
      address.className = "address";
      address.textContent = relay.url;

      const status = document.createElement("div");
      status.className = "status";
      status.textContent = "⚪ 未テスト";

      box.append(name, address, status);
      list.appendChild(box);

      statusElements.push(status);
    });

    function testRelay(relay, statusElement) {
      return new Promise((resolve) => {
        let finished = false;
        let socket;

        const timer = setTimeout(() => {
          finish("⏳ タイムアウト");
        }, 8000);

        function finish(message) {
          if (finished) return;
          finished = true;

          clearTimeout(timer);
          statusElement.textContent = message;

          if (socket) {
            socket.onopen = null;
            socket.onerror = null;
            socket.onclose = null;

            try {
              socket.close();
            } catch (_) {}
          }

          resolve(message);
        }

        statusElement.textContent = "🟡 接続中...";

        try {
          socket = new WebSocket(relay.url);

          socket.onopen = () => {
            finish("🟢 WebSocket接続成功");
          };

          socket.onerror = () => {
            finish("🔴 接続エラー");
          };

          socket.onclose = () => {
            if (!finished) {
              finish("🔴 接続が閉じられました");
            }
          };
        } catch (error) {
          finish("🔴 接続を開始できません");
        }
      });
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      summary.textContent = "🟡 テスト実行中...";

      const results = await Promise.all(
        relays.map((relay, index) =>
          testRelay(relay, statusElements[index])
        )
      );

      const successful = results.filter(
        result => result.includes("接続成功")
      ).length;

      summary.textContent =
        `テスト終了：${successful} / ${relays.length} 接続成功`;

      button.disabled = false;
    });
  </script>
</body>
</html>
